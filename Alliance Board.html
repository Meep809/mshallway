/* Layout: a 16:9 hallway screen. Header (school, quarter, clock) / rotating full-width slides / footer (progress, dots, live ranking). Alliance standings are drawn as race lanes toward a finish line. */
:root{

  --line:#2b4569;
  --fg:#f1f4f9;
  --dim:#a6b6cc;

  --a1:#ff6b4a;
  --a2:#3fa7ff;
  --a3:#4fcf8f;
  --a4:#b58cff;
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html{font-size:clamp(13px,1.0417vw,44px);height:100%;box-sizing:border-box}

button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding-block:1.1rem .5rem}
.brand{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;min-width:0}
.school{font:800 2rem/1 var(--display);letter-spacing:-.01em;margin:0;overflow-wrap:anywhere}
.quarter{font-weight:700;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.clock{text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.clock b{display:block;font:800 2.3rem/1 var(--display)}
.clock span{color:var(--dim);font-size:1rem;font-weight:600}

.stage{position:relative;min-height:0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;gap:1.1rem;padding-block:.4rem 1rem;min-height:0;
  opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease,visibility 0s linear .6s}

.title{font:800 3.4rem/1 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.note{color:var(--dim);font-size:1.15rem;font-weight:600}
.note b{color:var(--gold)}

/* standings */
.lanes{flex:1;min-height:0;display:grid;grid-auto-rows:minmax(0,1fr);gap:.8rem}
.lane{--g:100%;display:grid;grid-template-columns:3.6rem 4.6rem minmax(0,1fr) auto;align-items:center;gap:1.4rem;background:var(--panel);padding:.7rem 1.6rem .7rem 1.2rem;border-radius:.4rem;min-height:0}

.lb{min-width:0;display:flex;flex-direction:column;gap:.6rem}
.lh{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap}

.cards .card{padding:1.6rem 1.8rem}

.who{font:800 2.3rem/1.1 var(--display);margin:0 0 .4rem;letter-spacing:-.01em}

.foot{padding-block:.5rem 1rem;display:flex;flex-direction:column;gap:.7rem}

.frow{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.dots{display:flex;gap:.5rem}
.dot{width:.9rem;height:.9rem;padding:0;border:0;border-radius:50%;background:var(--line);cursor:pointer}
.dot.on{background:var(--gold)}
.mini{display:flex;gap:.5rem 1.4rem;flex-wrap:wrap;font-weight:700;font-size:1.1rem;color:var(--dim)}
.mini span{display:inline-flex;align-items:center;gap:.5rem;font-variant-numeric:tabular-nums}
.mini .crest{width:1.3rem;height:1.3rem}

/* editor */
.gear{position:fixed;right:calc(.8rem + env(safe-area-inset-right,0px));bottom:calc(.8rem + env(safe-area-inset-bottom,0px));z-index:15;background:var(--panel2);border:1px solid var(--line);border-radius:.4rem;padding:.5rem .9rem;font-weight:700;font-size:.9rem;cursor:pointer;opacity:.25;transition:opacity .2s}

.panel{position:fixed;top:0;right:0;bottom:0;width:min(36rem,100%);z-index:20;background:#0f1f34;border-left:1px solid var(--line);display:flex;flex-direction:column;font-size:16px;line-height:1.4}
.panel[hidden]{display:none}
.pbody{flex:1;min-height:0;overflow:auto;padding:calc(1rem + env(safe-area-inset-top,0px)) calc(1rem + env(safe-area-inset-right,0px)) 1rem 1rem;display:flex;flex-direction:column;gap:1.4rem}
.pfoot{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.8rem calc(1rem + env(safe-area-inset-right,0px)) calc(.8rem + env(safe-area-inset-bottom,0px)) 1rem;border-top:1px solid var(--line);background:#0c1a2d}
.panel h2{font:800 1.3rem/1.1 var(--display);margin:0}
.panel h3{font:700 .8rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 .6rem}
.hint{margin:0;color:var(--dim);font-size:.9rem}
.sec{display:flex;flex-direction:column;gap:.6rem;min-width:0}
.rows{display:flex;flex-direction:column;gap:.7rem}
.row{display:flex;flex-direction:column;gap:.5rem;background:var(--panel);padding:.7rem;border-radius:.3rem;min-width:0}

.fld{display:flex;flex-direction:column;gap:.2rem;min-width:0}

.in{width:100%;min-width:0;background:#091523;color:var(--fg);border:1px solid var(--line);border-radius:.25rem;padding:.5rem .6rem;font:inherit}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:.25rem;padding:.45rem .8rem;font-weight:700;cursor:pointer}
.btn.pri{background:var(--gold);color:#1a1300;border-color:var(--gold)}
.btn.sm{padding:.3rem .6rem;font-size:.85rem}
.x{align-self:flex-start;background:none;border:0;color:var(--dim);text-decoration:underline;cursor:pointer;padding:0;font-size:.85rem}
.add{align-self:flex-start;background:none;border:1px dashed var(--line);border-radius:.25rem;color:var(--fg);padding:.4rem .8rem;cursor:pointer;font-weight:600}
.quick{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.sw{display:inline-block;width:1rem;height:1rem;border-radius:50%;background:var(--c)}
.status{flex:1;min-width:8rem;font-size:.9rem;color:var(--dim)}
.status.err{color:#ff9a86}
.banner{background:var(--panel2);border-left:4px solid var(--gold);padding:.6rem .8rem;font-size:.9rem;margin:0}

@media (max-width:760px){

  .item{grid-template-columns:5.5rem minmax(0,1fr);gap:.8rem}
  .when{font-size:1.4rem}.what{font-size:1.4rem}
  .ev{grid-template-columns:4.5rem minmax(0,1fr);gap:.8rem}
  .db b{font-size:2.4rem}

}

  if(S.announcements&&S.announcements.length)push('news',h('section',{class:'slide'},head('From the office','Announcements'),
    h('div',{class:'cards'},S.announcements.slice(0,6).map(function(a){return h('div',{class:'card'},h('h3',{},a.title),a.text?h('p',{},a.text):null)}))));
  if(S.shoutouts&&S.shoutouts.length)push('shout',h('section',{class:'slide'},head('Caught being great','Shout-outs'),
    h('div',{class:'cards'},S.shoutouts.slice(0,6).map(function(a){return h('div',{class:'card'},h('p',{class:'who',style:'color:var(--fg)'},a.who),a.why?h('p',{},a.why):null)}))));
  if(S.value&&S.value.word)push('value',h('section',{class:'slide'},head('Word of the week',''),
    h('div',{class:'value'},h('p',{class:'word'},S.value.word),S.value.text?h('p',{},S.value.text):null)));
}

function clockText(){
  var d=new Date();
  return{t:d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}),d:d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})};
}

function render(){
  var S=STATE,app=document.getElementById('app');
  app.textContent='';
  buildSlides();
  var ck=clockText(),clockB=h('b',{id:'ck-t'},ck.t),clockD=h('span',{id:'ck-d'},ck.d);
  var top=h('header',{class:'top'},
    h('div',{class:'brand'},h('h1',{class:'school'},S.school||'Our School'),S.quarter?h('span',{class:'quarter'},S.quarter):null),
    h('div',{class:'clock'},clockB,clockD));
  var stage=h('main',{class:'stage'},slides);
  var mini=h('div',{class:'mini'});
  S.alliances.map(function(a,i){return{a:a,i:i}}).sort(function(x,y){return y.a.points-x.a.points}).forEach(function(o){
    mini.append(h('span',{style:'--c:'+cvar(o.i)},crest(o.i),o.a.name+' ',h('b',{},fmt(o.a.points))));
  });
  dotEls=slides.map(function(_,i){return h('button',{type:'button',class:'dot','aria-label':'Show slide '+(i+1),onclick:function(){show(i)}})});
  bar=h('i',{});
  var foot=h('footer',{class:'foot'},h('div',{class:'bar'},bar),h('div',{class:'frow'},h('div',{class:'dots'},dotEls),mini));
  app.append(top,stage,foot);
  lastDay=dateKey(new Date());
  idx=Math.min(idx,Math.max(slides.length-1,0));
  requestAnimationFrame(function(){requestAnimationFrame(function(){show(idx)})});
}

function dur(i){
  var s=Math.max(5,Number(STATE.seconds)||12);
  return kinds[i]==='standings'?s*1.6:s;
}
function show(i){
  clearTimeout(timer);
  if(!slides.length)return;
  idx=(i+slides.length)%slides.length;
  slides.forEach(function(el,j){el.classList.toggle('on',j===idx);dotEls[j].classList.toggle('on',j===idx)});
  var d=dur(idx);
  bar.style.animation='none';void bar.offsetWidth;bar.style.animation='';
  bar.style.setProperty('--d',d+'s');
  if(!paused&&slides.length>1)timer=setTimeout(function(){show(idx+1)},d*1000);
}
function tick(){
  var c=clockText(),a=document.getElementById('ck-t'),b=document.getElementById('ck-d');
  if(a)a.textContent=c.t;
  if(b)b.textContent=c.d;
  if(dateKey(new Date())!==lastDay&&!paused){render()}
}

/* ---------- editor ---------- */
var panel=null,pbody=null,pstatus=null,draft=null,uid=0;

function inp(obj,f){
  var id='f'+(++uid),t=f.t||'text';
  var el=h('input',{id:id,type:t,class:'in',value:obj[f.k]==null?'':obj[f.k],placeholder:f.ph||null});
  el.addEventListener('input',function(){obj[f.k]=t==='number'?(el.value===''?0:Number(el.value)):el.value});
  return h('label',{class:'fld',for:id},h('span',{},f.l),el);
}
function rows(arr,fields,blank,addLabel){
  var wrap=h('div',{class:'rows'});
  function paint(){
    wrap.textContent='';
    arr.forEach(function(it,i){
      wrap.append(h('div',{class:'row'},
        h('div',{class:'rowf'},fields.map(function(f){return inp(it,f)})),
        h('button',{type:'button',class:'x',onclick:function(){arr.splice(i,1);paint()}},'Remove')));
    });
    wrap.append(h('button',{type:'button',class:'add',onclick:function(){arr.push(clone(blank));paint()}},addLabel));
  }
  paint();
  return wrap;
}
function allianceEditor(){
  var wrap=h('div',{class:'rows'});
  function paint(){
    wrap.textContent='';
    draft.alliances.forEach(function(a,i){
      var pf=inp(a,{k:'points',l:'Points',t:'number'}),wf=inp(a,{k:'week',l:'This week',t:'number'});
      var pin=pf.querySelector('input'),win=wf.querySelector('input');
      function bump(n){a.points=(Number(a.points)||0)+n;a.week=(Number(a.week)||0)+n;pin.value=a.points;win.value=a.week}
      var quick=h('div',{class:'quick'},
        [-10,-5,5,10,25].map(function(n){return h('button',{type:'button',class:'btn sm',onclick:function(){bump(n)}},(n>0?'+':'')+n)}),
        h('span',{class:'hint'},'adds to both totals'));
      wrap.append(h('div',{class:'row',style:'--c:'+cvar(i)},
        h('div',{class:'quick'},h('span',{class:'sw'}),h('b',{},'Alliance '+(i+1))),
        h('div',{class:'rowf'},inp(a,{k:'name',l:'Name'}),pf,wf),
        quick,
        draft.alliances.length>2?h('button',{type:'button',class:'x',onclick:function(){draft.alliances.splice(i,1);paint()}},'Remove alliance'):null));
    });
    if(draft.alliances.length<6)wrap.append(h('button',{type:'button',class:'add',onclick:function(){draft.alliances.push({name:'New alliance',points:0,week:0});paint()}},'Add alliance'));
  }
  paint();
  return wrap;
}
function sec(title,body,hint){return h('section',{class:'sec'},h('h3',{},title),hint?h('p',{class:'hint'},hint):null,body)}

function paintPanel(){
  uid=0;pbody.textContent='';
  var d=draft;d.today=d.today||{};d.today.schedule=d.today.schedule||[];d.events=d.events||[];d.announcements=d.announcements||[];d.shoutouts=d.shoutouts||[];d.value=d.value||{word:'',text:''};
  pbody.append(
    h('h2',{},'Edit the board'),
    STATE.sample?h('p',{class:'banner'},'The board is showing sample content. Replace it with yours and press Save. The hallway screen updates by itself.'):null,
    sec('Alliances',allianceEditor()),
    sec('Today',h('div',{class:'rows'},
      h('div',{class:'rowf'},inp(d.today,{k:'lunch',l:'Lunch'}),inp(d.today,{k:'note',l:'Note for today'})),
      rows(d.today.schedule,[{k:'time',l:'Time'},{k:'label',l:'What'}],{time:'',label:''},'Add schedule line'))),
    sec('Events',rows(d.events,[{k:'date',l:'Date',t:'date'},{k:'time',l:'Time'},{k:'title',l:'Event'},{k:'place',l:'Place'}],{date:'',time:'',title:'',place:''},'Add event'),'Past events drop off the board on their own.'),
    sec('Announcements',rows(d.announcements,[{k:'title',l:'Headline'},{k:'text',l:'Details'}],{title:'',text:''},'Add announcement')),
    sec('Shout-outs',rows(d.shoutouts,[{k:'who',l:'Who'},{k:'why',l:'Why'}],{who:'',why:''},'Add shout-out')),
    sec('Word of the week',h('div',{class:'rowf'},inp(d.value,{k:'word',l:'Word'}),inp(d.value,{k:'text',l:'Challenge'}))),
    sec('Board settings',h('div',{class:'rowf'},inp(d,{k:'school',l:'School name'}),inp(d,{k:'quarter',l:'Quarter or term'}),inp(d,{k:'goal',l:'Finish line (points, 0 for none)',t:'number'}),inp(d,{k:'seconds',l:'Seconds per slide',t:'number'})))
  );
}
function setStatus(msg,err){pstatus.textContent=msg||'';pstatus.className='status'+(err?' err':'')}
function openPanel(){
  draft=clone(STATE);paintPanel();setStatus('');
  panel.hidden=false;paused=true;clearTimeout(timer);document.body.classList.add('paused');
  var f=panel.querySelector('input');if(f)f.focus();
}
function closePanel(){
  panel.hidden=true;paused=false;document.body.classList.remove('paused');show(idx);
}
function clean(s){
  s.alliances=s.alliances.filter(function(a){return a.name&&String(a.name).trim()});
  s.alliances.forEach(function(a){a.points=Number(a.points)||0;a.week=Number(a.week)||0});
  s.events=s.events.filter(function(e){return e.title&&e.date});
  s.announcements=s.announcements.filter(function(a){return a.title||a.text});
  s.shoutouts=s.shoutouts.filter(function(a){return a.who||a.why});
  s.today.schedule=s.today.schedule.filter(function(r){return r.label});
  s.goal=Number(s.goal)||0;
  s.seconds=Math.max(5,Math.min(60,Number(s.seconds)||12));
  s.sample=false;
  return s;
}
async function save(){
  var btn=document.getElementById('save-btn');
  btn.disabled=true;setStatus('Saving…');
  try{
    var c=window.claude&&window.claude.use?await window.claude.use('artifact'):null;
    if(!c)throw{code:'unavailable'};
    await c.publish(buildDoc(clean(clone(draft))));
    setStatus('Saved. The board is reloading.');
  }catch(e){
    btn.disabled=false;
    var code=e&&e.code,msg;
    if(code==='conflict')msg='Someone saved a newer version first. The page is reloading, so make your changes again.';
    else if(code==='not_writer'||code==='not_granted'||code==='not_declared'||code==='capability_disabled'||code==='consent_required')msg='This account can view the board but not change it. Ask the owner for edit access.';
    else if(code==='unavailable')msg='Saving is not available in this view. Open the board from your claude.ai gallery.';
    else if(code==='rate_limited')msg='Too many saves in a row. Wait a minute and try again.';
    else if(code==='too_large')msg='The board is too large to save. Remove some entries.';
    else msg='Could not save. Check your connection and try again.';
    setStatus(msg,true);
  }
}
function buildPanel(){
  pstatus=h('div',{class:'status','aria-live':'polite'});
  pbody=h('div',{class:'pbody'});
  panel=h('aside',{class:'panel',hidden:true,'aria-label':'Edit the board'},
    pbody,
    h('div',{class:'pfoot'},
      h('button',{type:'button',class:'btn pri',id:'save-btn',onclick:save},'Save'),
      h('button',{type:'button',class:'btn',onclick:closePanel},'Close'),
      h('button',{type:'button',class:'btn',onclick:function(){try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(function(){})}catch(e){}}},'Full screen'),
      pstatus));
  document.body.append(
    h('button',{type:'button',class:'gear',onclick:openPanel,'aria-label':'Edit the board'},'Edit board'),
    panel);
}

document.addEventListener('keydown',function(ev){
  var tag=(ev.target&&ev.target.tagName)||'';
  if(ev.key==='Escape'&&!panel.hidden){closePanel();return}
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  if(!panel.hidden)return;
  if(ev.key==='ArrowRight')show(idx+1);
  else if(ev.key==='ArrowLeft')show(idx-1);
  else if(ev.key==='e'||ev.key==='E')openPanel();
});

async function keepAwake(){
  try{if(navigator.wakeLock&&document.visibilityState==='visible'){await navigator.wakeLock.request('screen')}}catch(e){}
}
document.addEventListener('visibilitychange',keepAwake);

buildPanel();
render();
keepAwake();
setInterval(tick,15000);
})();
</script></body></html>
